<!DOCTYPE html>
<html lang="uk-UA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Polistud</title>
    <link rel="icon" type="image/png" href="../../../images/logo.png">
    <link rel="stylesheet" href="../../../styles/subjects/discretemathematics/graphs.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="all">
      <aside class="sidebar">
        <div id="logobox">
          <img id="mainbutton" src="../../../images/logo.png" />
          <h2 id="text2">Онлайн-помічник <br> Для студентів</h2>
        </div>
        <div id="chat-panel">
           <div id="chat-messages"></div>
            <div id="input-box">
              <input id="msg" placeholder="Type your message..." />
              <button id="sendBtn">Send</button>
              <button id="clearBtn">Clear</button>
            </div>
        </div>
      </aside>
      <main class="content">
        <header class="header">
          <h1 id="mpname">Теорія графів</h1>
          <a href="../../../sources/aboutus.pdf" target="_blank" id="aboutus">Про нас.pdf</a>
          <a href="../../../sources/abouteducation.pdf" target="_blank" id="abouted">Про навчання.pdf</a>
        </header>
        <div class="inside">
          <section class="mainpl">
            <div id="player"></div>
              <h3 class="theme" id="theme1">Основи, означення, подання графів</h3>
              <h3 class="theme" id="theme2">Дерева в теорії графів</h3>
              <h3 class="theme" id="theme3">Шляхи і цикли: Леонард Ейлер‑графи, Вільям Гамільтон‑графи</h3>
              <h3 class="theme" id="theme4">Розфарбування графів, хроматичне число</h3>
              <h3 class="theme" id="theme5">Теорія графів з точки зору інформатики</h3>
              <div id="genconspectback">
                <button id="genconspectbutton">Конспект</button>
                <object 
                data="../../../sources/Теорія графів.pdf" 
                id="pdf"
                type="application/pdf"
                >
                </object>
            </div>
          </section>
          <aside class="insidebar">
              <button class="video-btn" data-video="7lfrD07Fsnk" data-title="Дерева в теорії графів. Основна теорема" data-theme="theme2">
              </button>
              <button class="video-btn" data-video="Zv6wxiv8F4c" data-title="Шляхи і цикли Ейлера. Гамільтонів цикл у графі." data-theme="theme3">
              </button>
              <button class="video-btn" data-video="vX5S1U2uhW4" data-title="Дискретна математика. Лекція 12: Розфарбування графів" data-theme="theme4">
              </button>
              <button class="video-btn" data-video="LFKZLXVO-Dg" data-title="Introduction to Graph Theory: A Computer Science Perspective" data-theme="theme5">
              </button>
          </aside>
        </div>
      </main>
    </div>
    <script type="module" src="../../../scripts/subjects/discretemathematics/graphs.js"></script>
  </body>
</html>
