<!DOCTYPE html>
<html lang="uk-UA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Polistud</title>
    <link rel="icon" type="image/png" href="../images/logo.png">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="all">
      <aside class="sidebar">
        <div id="logobox">  
          <img id="mainbutton" src="../images/logo.png" />
          <h2 id="text2">Онлайн-помічник <br> Для студентів</h2>
        </div>
        <div id="chat-panel">
           <div id="chat-messages"><div id="chat-placeholder">Чат-помічник</div></div>
            <div id="input-box">
              <input id="msg" placeholder="Чим можу допомогти?" />
              <button id="sendBtn">Send</button>
              <button id="clearBtn">Clear</button>
            </div>
        </div>
      </aside>
      <main class="content">
        <header class="header">
          <h1 id="mpname">Головна</h1>
          <a href="../sources/aboutus.pdf" target="_blank" id="aboutus">Про нас.pdf</a>
          <a href="../sources/abouteducation.pdf" target="_blank" id="abouted">Про навчання.pdf</a>
        </header>
        <section class="subjects">
          <button id="algebraButton">Алгебра та геометрія</button>
          <button id="discreteMathButton">Дискретна математика</button>
          <button id="algorithmizationButton">Алгоритмізація та програмування</button>
        </section>
      </main>
    </div>
    <script type="module" src="../scripts/fromMainButtons.js"></script>
  </body>
</html>
