<!DOCTYPE html>
<html lang="uk-UA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Polistud</title>
    <link rel="icon" type="image/png" href="../images/logo.png">
    <link rel="stylesheet" href="../styles/algebraandgeometry.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="all">
      <aside class="sidebar">
        <div id="logobox">
          <img id="mainbutton" src="../images/logo.png" />
          <h2 id="text2">Онлайн-помічник <br> Для студентів</h2>
        </div>
        <div id="chat-panel">
           <div id="chat-messages"><div id="chat-placeholder">Чат-помічник</div></div>
            <div id="input-box">
              <input id="msg" placeholder="Чим можу допомогти?" />
              <button id="sendBtn">Send</button>
              <button id="clearBtn">Clear</button>
            </div>
        </div>
      </aside>
      <main class="content">
        <header class="header">
          <h1 id="mpname">Алгебра та геометрія</h1>
          <a href="../sources/aboutus.pdf" target="_blank" id="aboutus">Про нас</a>
          <a href="../sources/abouteducation.pdf" target="_blank" id="abouted">Про навчання</a>
        </header>
        <section class="subjects">
          <button id="b1">
            <h3 class="numbers">1</h3>
            Визначники</button>
          <button id="b2">
            <h3 class="numbers">2</h3>
            Матриці</button>
          <button id="b3">
            <h3 class="numbers">3</h3>
            СЛАР</button>
          <button id="b4">
            <h3 class="numbers">4</h3>
            Векторна алгебра</button>
          <button id="b5">
            <h3 class="numbers">5</h3>
            Лінійний n-вимірний простір</button>
          <button id="b6">
            <h3 class="numbers">6</h3>
            Пряма на площині</button>
          <button id="b7">
            <h3 class="numbers">7</h3>
            Алгебраїчні лінії другого порядку на площині</button>
          <button id="b8">
            <h3 class="numbers">8</h3>
            Пряма і площина в просторі</button>
          <button id="b9">
            <h3 class="numbers">9</h3>
            Алгебраїчні поверхні другого порядку в просторі</button>
        </section>
      </main>
    </div>
    <script type="module" src="../scripts/algebraandgeometrybuttons.js"></script>
  </body>
</html>
